services:
  # 1. LocalStack (Our AWS S3 Data Lake)
  localstack:
    image: localstack/localstack:3.0
    container_name: localstack_s3
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

  # 2. Zookeeper (Required by Kafka)
  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"

  # 3. Apache Kafka (Our Streaming Broker)
  kafka:
    image: wurstmeister/kafka:latest
    container_name: kafka_broker
    ports:
      - "9092:9092"
    environment:
      #KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://10.0.2.15:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - zookeeper

  # 4. PostgreSQL (Open-Source Data Warehouse)
  postgres:
    image: postgres:15
    container_name: postgres_warehouse
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: data_warehouse
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: